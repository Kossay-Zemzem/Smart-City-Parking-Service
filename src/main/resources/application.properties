spring.application.name=parking

spring.graphql.graphiql.enabled=true

#automatically update the database schema
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
#-----------------------------------------------------------------

#-------------------------------------------------
#  Paramètres de la base de données
#-------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/parkingDB;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
#dialect for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

#-------------------------------------------------
#  Paramètres de l'application
#-------------------------------------------------
# Port utilisé par l'application (modifiez si nécessaire)
server.port = 8083

#-------------------------------------------------
# Eureka microservice registration Configuration
#-------------------------------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
